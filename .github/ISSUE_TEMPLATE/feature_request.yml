name: 💡 功能建议
description: 提出一个新功能或改进想法
labels: ['enhancement']
body:
  - type: textarea
    id: idea
    attributes:
      label: 想要什么功能？
      description: 描述你希望 Ale OS 做什么、解决什么问题
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: 目前怎么解决？
      description: 没有这个功能时你的替代方案（如有）
  - type: checkboxes
    id: scope
    attributes:
      label: 涉及范围
      options:
        - label: 桌面壳
        - label: 某个内嵌应用
        - label: 新应用集成
        - label: 部署 / CI
