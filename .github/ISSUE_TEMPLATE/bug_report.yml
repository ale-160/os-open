name: 🐛 问题报告
description: 报告一个 bug 或异常行为
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: 感谢反馈！请尽量填写以下信息，便于定位问题。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 期望行为 vs 实际行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 出现 …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及区域
      options:
        - 桌面壳（网格/文件夹/多页/主题）
        - 应用窗口（多任务/dock）
        - 图片工具箱
        - Markdown 编辑器
        - P2P 聊天室
        - 系统图库 / 剪贴板
        - 应用商城
        - 数据迁移
        - 部署 / CI
        - 其他
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器与系统
      placeholder: Chrome 140 / Windows 11
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: 控制台报错（如有）
      render: shell
