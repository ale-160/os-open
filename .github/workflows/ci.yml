name: CI

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Shell lint / typecheck / unit tests
        run: |
          pnpm --filter shell lint
          pnpm --filter shell typecheck
          pnpm --filter shell test

      - name: Apps lint
        run: |
          pnpm --filter web-img lint
          pnpm --filter web-text lint
          pnpm --filter typev lint
          pnpm --filter pet lint

      - name: web-img encoder tests (GIF/TIFF roundtrip)
        run: |
          cd apps/web-img
          node node_modules/typescript/bin/tsc src/utils/gifEncoder.ts --outDir .test-tmp --module commonjs --target es2020 --skipLibCheck
          node scripts/test-gif-encoder.mjs
          node node_modules/typescript/bin/tsc src/utils/imageEncoders.ts --outDir .test-tmp --module commonjs --target es2020 --skipLibCheck
          node scripts/test-tiff-encoder.mjs
          node node_modules/typescript/bin/tsc src/utils/sheetConvert.ts --outDir .test-tmp --module es2020 --target es2020 --moduleResolution bundler --skipLibCheck
          node scripts/test-sheet-convert.mjs

      - name: nchat unit tests
        run: pnpm --filter nchat test

      - name: pet unit tests
        run: pnpm --filter pet test

      - name: Build all apps + compose
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Verify composed site
        run: |
          test -f out/index.html
          test -f out/img/index.html
          test -f out/text/index.html
          test -f out/pet/index.html
          test -f out/sitemap.xml

      - name: Install Playwright browsers
        run: pnpm --filter shell exec playwright install --with-deps chromium

      - name: E2E (shell)
        run: pnpm --filter shell e2e

      - name: E2E (pet)
        run: pnpm --filter pet e2e
