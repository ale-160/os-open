packages:
  - "apps/*"
  - "packages/*"

# 版本目录：跨应用共享的依赖在此统一声明，各 app 用 "catalog:" 引用。
# 新应用接入时直接写 catalog: 即可获得与系统一致的技术栈版本。
# vitest / vite 各 app 版本策略不同，暂不纳入。
catalog:
  # 框架
  next: 16.4.2
  react: 19.3.1
  react-dom: 19.3.1
  # 样式（Tailwind 4 + shadcn 配套）
  tailwindcss: ^4
  "@tailwindcss/postcss": ^4
  tw-animate-css: ^1.4.0
  tailwind-merge: ^3.5.0
  clsx: ^2.1.1
  class-variance-authority: ^0.7.1
  radix-ui: ^1.8.1
  lucide-react: ^1.61.0
  sonner: ^2.0.7
  # 状态
  zustand: ^5.0.12
  # 工具链
  typescript: ^5
  eslint: ^9
  eslint-config-next: 16.4.2
  "@types/node": ^26.6.5
  "@types/react": ^19
  "@types/react-dom": ^19
  "@playwright/test": ^1.64.1
